# Builds the site (Astro Starlight) and publishes it to GitHub Pages, https://orgkeep.org.
# Runs on every push to main, which includes the documentation synced from orgkeep/orgkeep (see its workflow
# "Sync the documentation"), and by hand (Actions > Pages > Run workflow).
# Settings > Pages > Source must be "GitHub Actions".
# Third-party actions are pinned by commit, with their version in a comment.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # publish the site
  id-token: write   # proves to Pages that the deployment comes from this workflow

# One deployment at a time; a newer one waits for the one in progress, which is not cancelled halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
